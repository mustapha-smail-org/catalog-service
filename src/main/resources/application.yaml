spring:
  application:
    name: catalog-service

  mvc:
    problemdetails:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  transaction:
    default-timeout: 10s

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.query.timeout: 5000
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS}
  client:
    enabled: ${EUREKA_ENABLED}
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}

log:
  level:
    root: INFO
    app: INFO
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db

  metrics:
    tags:
      application: catalog-service
app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    username: ${KAFKA_USERNAME}
    password: ${KAFKA_PASSWORD}
    sasl-mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
    ca-certificate: ${KAFKA_CA_CERTIFICATE:"classpath:keystore/ca.pem"}

    topic:
      events: ${KAFKA_EVENTS_TOPIC:citypulse.events.v1}
      events-dlt: ${KAFKA_EVENTS_DLT_TOPIC:citypulse.events.v1.DLT}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:catalog-service-v1}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
      auto-startup: ${KAFKA_CONSUMER_AUTO_STARTUP:true}

    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:2000}

    schema-registry:
      url: ${SCHEMA_REGISTRY_URL}
      username: ${SCHEMA_REGISTRY_USERNAME}
      password: ${SCHEMA_REGISTRY_PASSWORD}
      auto-register-schemas: false
