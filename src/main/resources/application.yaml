spring:
  application:
    name: catalog-service

  mvc:
    problemdetails:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  transaction:
    default-timeout: 10s

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.query.timeout: 5000
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        # Batch-load LAZY collections (categories, occurrences) for all rows of a
        # page in a few IN (...) queries instead of one round-trip per row (N+1).
        # Matters most for /events/map (limit 100) against the remote DB.
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    # Chat autoconfig is off unless a deploy opts in (prod enrichment box sets
    # this to "openai" alongside app.enrichment.enabled). Keeps every other
    # deploy and the test context free of any model wiring or API key.
    model:
      chat: ${AI_CHAT_MODEL:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${AI_OPENAI_MODEL:gpt-5.6-luna}

log:
  level:
    root: INFO
    app: INFO
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db

  metrics:
    tags:
      application: catalog-service
app:
  admin:
    # Shared secret for the admin read endpoints (feedback + reports). Blank =
    # endpoints deny every request, so a deploy without it exposes nothing.
    token: ${ADMIN_API_TOKEN:}
  cache:
    enabled: ${CACHE_ENABLED:true}
    ttl: ${CACHE_TTL:30m}
    max-size: ${CACHE_MAX_SIZE:1000}
  enrichment:
    # Whole worker off unless a deploy opts in (needs OPENAI_API_KEY and
    # spring.ai.model.chat=openai). Model here is recorded on each row.
    enabled: ${ENRICHMENT_ENABLED:false}
    dry-run: ${ENRICHMENT_DRY_RUN:false}
    batch-size: ${ENRICHMENT_BATCH_SIZE:50}
    max-retries: ${ENRICHMENT_MAX_RETRIES:2}
    prompt-version: ${ENRICHMENT_PROMPT_VERSION:1}
    model: ${ENRICHMENT_MODEL:gpt-5.6-luna}
    interval-ms: ${ENRICHMENT_INTERVAL_MS:300000}
    initial-delay-ms: ${ENRICHMENT_INITIAL_DELAY_MS:60000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    username: ${KAFKA_USERNAME}
    password: ${KAFKA_PASSWORD}
    sasl-mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
    ca-certificate: ${KAFKA_CA_CERTIFICATE:"classpath:keystore/ca.pem"}

    topic:
      events: ${KAFKA_EVENTS_TOPIC:citypulse.events.v1}
      events-dlt: ${KAFKA_EVENTS_DLT_TOPIC:citypulse.events.v1.DLT}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:catalog-service-v1}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
      auto-startup: ${KAFKA_CONSUMER_AUTO_STARTUP:true}

    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:2000}

    schema-registry:
      url: ${SCHEMA_REGISTRY_URL}
      username: ${SCHEMA_REGISTRY_USERNAME}
      password: ${SCHEMA_REGISTRY_PASSWORD}
      auto-register-schemas: false
