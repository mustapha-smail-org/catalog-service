name: PR
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    permissions:
      contents: read
    uses: mustapha-smail-org/deployment-workflows/.github/workflows/ci-pr.yml@main
    with:
      java-version: '21'
      sonar-project-key: mustapha-smail-org_catalog-service
      sonar-project-name: 'CityPulse Catalog Service'
      sonar-organization: mustapha-smail-org
      jacoco-threshold: '70'
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
